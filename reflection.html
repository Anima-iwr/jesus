<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reflection | Come, Taste & See</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#fcf8f4;color:#2c1947;font:17px/1.85 'DM Sans',sans-serif}header{background:#281845;padding:20px 6%;color:#f8d591}header a{color:inherit;text-decoration:none;font-weight:700}main{max-width:820px;margin:45px auto;padding:0 24px 90px}.paper{background:white;border:1px solid #e8dced;border-radius:25px;padding:clamp(22px,5vw,65px);box-shadow:0 16px 50px #24143f12}.back{color:#6d438c;text-decoration:none;font-weight:700}h1,h2,h3{font-family:'Playfair Display',serif;line-height:1.23}h1{font-size:clamp(2.5rem,6vw,4rem);margin:18px 0}h2{font-size:1.7rem;margin-top:38px}h3{font-size:1.35rem}p,li{color:#433953}li{margin-bottom:8px}blockquote{border-left:4px solid #e9bd70;padding-left:20px;color:#5a426a}#meta{color:#865c94}a{color:#623d8d}hr{border:0;border-top:1px solid #eaddec;margin:30px 0}#loading{color:#755b84}</style></head><body><header><a href="index.html#reflections">✦ Come, Taste & See</a></header><main><a class="back" href="index.html#reflections">← All reflections</a><article class="paper" id="article"><p id="loading">Loading reflection…</p></article></main><script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script>
(async()=>{const box=document.getElementById('article');const file=new URLSearchParams(location.search).get('file');if(!file||!/^reflections\/[a-zA-Z0-9._-]+\.md$/.test(file)){box.textContent='Reflection not found.';return}try{const index=await(await fetch('reflections.json',{cache:'no-store'})).json();const item=index.find(x=>x.file===file);if(!item)throw Error('Unknown article');const response=await fetch(file);if(!response.ok)throw Error('Article unavailable');const raw=await response.text();const body=raw.replace(/^---\s*\n[\s\S]*?\n---\s*\n/,'');if(!window.marked||!window.DOMPurify)throw Error('Reader libraries unavailable');box.innerHTML='<div id="meta"></div><div id="content"></div>';document.getElementById('meta').textContent=item.date+' · '+(item.category||'Reflection');document.getElementById('content').innerHTML=DOMPurify.sanitize(marked.parse(body));document.title=item.title+' | Come, Taste & See';}catch(e){box.textContent='Sorry, this reflection could not be loaded. Please return to the reflections page.'}})();
</script></body></html>
