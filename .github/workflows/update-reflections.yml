name: Update reflection index
on:
  push:
    paths:
      - 'reflections/**'
      - 'build_reflections.py'
      - '.github/workflows/update-reflections.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate reflection listing
        run: python3 build_reflections.py
      - name: Commit updated index
        run: |
          if ! git diff --quiet -- reflections.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reflections.json
            git commit -m "Update reflection index"
            git push
          fi

